services:
  artifact-viewer:
    # Local builds still work with: docker compose build
    image: ghcr.io/sahibkhokhar/ephemera:latest
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Ephemera
      ARTIFACT_DB_PATH: /data/artifacts.db
      DEFAULT_TTL_MINUTES: "60"
      MAX_TTL_MINUTES: "10080"
      CLEANUP_INTERVAL_SECONDS: "30"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
