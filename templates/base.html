<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/ttl-countdown.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="8 13 54 40" width="26" height="19" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="navFade" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0.45" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
            </linearGradient>
            <mask id="navMask"><rect x="8" y="13" width="54" height="40" fill="url(#navFade)"/></mask>
          </defs>
          <path d="M22 17 L14 17 L14 47 L22 47" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M26 34C30 26 36 26 41 33C45 39 51 39 56 31" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" mask="url(#navMask)"/>
        </svg>
        <span class="brand-name">{{ app_name }}</span>
        <span class="brand-context">/ your instance</span>
      </a>
      <nav class="topnav">
        <a href="/api/docs">api</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">◐</span>
          <span data-theme-label>light mode</span>
        </button>
        <a class="topnav-accent" href="https://github.com/sahibkhokhar/ephemera" target="_blank" rel="noopener noreferrer">github <span class="ext-icon">→</span></a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>{{ app_name }} · self-hosted ephemeral artifact viewer</span>
      <a href="/api/docs" class="footer-link">API docs</a>
    </div>
  </footer>
</body>
</html>
