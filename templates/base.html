<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/ttl-countdown.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="topbar-brand">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">~</span>
          <span class="brand-name">{{ app_name }}</span>
        </a>
        <span class="instance-badge"><span class="instance-badge-dot"></span>this instance</span>
      </div>
      <nav class="topnav">
        <a href="/api/docs">api</a>
        <a class="topnav-accent" href="https://github.com/sahibkhokhar/ephemera">github ↗</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>{{ app_name }} · self-hosted ephemeral artifact viewer</span>
      <a href="/api/docs" class="footer-link">API docs</a>
    </div>
  </footer>
</body>
</html>
